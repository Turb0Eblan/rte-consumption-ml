[project]
name = "rte-consumption-ml"
version = "0.1.0"
requires-python = ">=3.12.1,<3.13"
dependencies = [
    "holidays>=0.107",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
